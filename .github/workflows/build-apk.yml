name: Build DeApp Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify native-only source
        run: |
          if grep -R -n -E "android\.webkit|WebViewClient|WebChromeClient|new[[:space:]]+WebView" app/src/main/java/id/deapp/app; then
            echo "WebView API detected in native source"
            exit 1
          fi

      - name: Build DeApp Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk deapp-android.apk

      - name: Upload DeApp Android APK
        uses: actions/upload-artifact@v4
        with:
          name: deapp-android-apk
          path: deapp-android.apk
